# Fly.io config for the Personal Finance API.
#
#   fly launch --no-deploy --copy-config   (first time only)
#   fly volumes create finance_data --size 1
#   fly secrets set JWT_SECRET=<random>
#   fly deploy
#
# Without the volume the SQLite file is lost on every machine replacement.

app = "personal-finance-api"
primary_region = "bom"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3000"
  NODE_ENV = "production"
  DATABASE_FILE = "/data/finance.db"

[mounts]
  source = "finance_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

[[http_service.checks]]
  grace_period = "5s"
  interval = "30s"
  method = "GET"
  path = "/health"
  timeout = "3s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"